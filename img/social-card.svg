<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Accent bar top -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)" />

  <!-- Grid pattern (subtle) -->
  <g opacity="0.05">
    <line x1="200" y1="0" x2="200" y2="630" stroke="white" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="white" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="white" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="white" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="white" stroke-width="1"/>
    <line x1="0" y1="126" x2="1200" y2="126" stroke="white" stroke-width="1"/>
    <line x1="0" y1="252" x2="1200" y2="252" stroke="white" stroke-width="1"/>
    <line x1="0" y1="378" x2="1200" y2="378" stroke="white" stroke-width="1"/>
    <line x1="0" y1="504" x2="1200" y2="504" stroke="white" stroke-width="1"/>
  </g>

  <!-- Title -->
  <text x="600" y="220" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="72" font-weight="bold" fill="white">
    Rostyman
  </text>

  <!-- Tagline -->
  <text x="600" y="290" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" fill="#a0aec0">
    The Local-First Desktop API Client
  </text>

  <!-- Divider -->
  <rect x="500" y="320" width="200" height="3" rx="2" fill="url(#accent)" />

  <!-- Subtitle -->
  <text x="600" y="380" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#718096">
    No Account. No Cloud. No Limits.
  </text>

  <!-- Protocol badges -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">
    <rect x="170" y="430" width="80" height="32" rx="6" fill="#e94560" opacity="0.2" stroke="#e94560" stroke-width="1"/>
    <text x="210" y="451" text-anchor="middle" fill="#e94560">HTTP</text>

    <rect x="270" y="430" width="95" height="32" rx="6" fill="#e94560" opacity="0.2" stroke="#e94560" stroke-width="1"/>
    <text x="317" y="451" text-anchor="middle" fill="#e94560">GraphQL</text>

    <rect x="385" y="430" width="70" height="32" rx="6" fill="#e94560" opacity="0.2" stroke="#e94560" stroke-width="1"/>
    <text x="420" y="451" text-anchor="middle" fill="#e94560">gRPC</text>

    <rect x="475" y="430" width="110" height="32" rx="6" fill="#e94560" opacity="0.2" stroke="#e94560" stroke-width="1"/>
    <text x="530" y="451" text-anchor="middle" fill="#e94560">WebSocket</text>

    <rect x="605" y="430" width="100" height="32" rx="6" fill="#e94560" opacity="0.2" stroke="#e94560" stroke-width="1"/>
    <text x="655" y="451" text-anchor="middle" fill="#e94560">Socket.IO</text>

    <rect x="725" y="430" width="75" height="32" rx="6" fill="#e94560" opacity="0.2" stroke="#e94560" stroke-width="1"/>
    <text x="762" y="451" text-anchor="middle" fill="#e94560">MQTT</text>

    <rect x="820" y="430" width="65" height="32" rx="6" fill="#e94560" opacity="0.2" stroke="#e94560" stroke-width="1"/>
    <text x="852" y="451" text-anchor="middle" fill="#e94560">SSE</text>

    <rect x="905" y="430" width="130" height="32" rx="6" fill="#e94560" opacity="0.2" stroke="#e94560" stroke-width="1"/>
    <text x="970" y="451" text-anchor="middle" fill="#e94560">AI Assistant</text>
  </g>

  <!-- URL -->
  <text x="600" y="560" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#4a5568">
    rostyman.com — Free for Windows, macOS &amp; Linux
  </text>

  <!-- Accent bar bottom -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#accent)" />
</svg>
